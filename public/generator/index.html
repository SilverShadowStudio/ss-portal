</div>

<br>

        <label for="bank">Bank Name:</label>

        <input type="text" id="swift" required><br><br>

        <label for="iban">IBAN:</label>
        <input type="text" id="iban" required><br><br>

        <!-- Second Invoice -->

        <br>
        <br>
        <br>

       <strong> <label> Invoice B </label> </strong>

        <br>

    <div class="invoiceA">

        <label for="date2"> Invoice Date: </label>
        <input type="date" id="invoiceInputDate" required>

    </form>

    </div>

    <h2>Invoice Items</h2>

    <form id="itemsForm">
        <div id="itemsContainer">

                <label>Category:</label>
                <input type="text" name="description[]" required>

                <label>Item:</label>
                <input type="text" name="quotation[]" required>

                <label>Price:</label>
                <input type="number" name="price[]" step="0.01" required>

                <button type="button" class="removeItem">❌</button>
            </div>

        <button type="submit">Save Items</button>
        <button type="button" id="addItem">Add Line</button>

</div>

<script>

// Saves all form data, VAT, downpayment, and items to localStorage
function saveAllData() {
    localStorage.setItem("client",           document.getElementById("client").value);
    localStorage.setItem("address",          document.getElementById("address").value);
    localStorage.setItem("contact",          document.getElementById("contact").value);
    localStorage.setItem("project",          document.getElementById("project").value);
    localStorage.setItem("invoiceDate",      document.getElementById("invoiceDate").value);
    localStorage.setItem("invoiceNumber",    document.getElementById("invoiceNumber").value);
    localStorage.setItem("invoiceInputDate", document.getElementById("invoiceInputDate").value);
    localStorage.setItem("bank",             document.getElementById("bank").value);
    localStorage.setItem("sortCode",         document.getElementById("sortCode").value);
    localStorage.setItem("accountNumber",    document.getElementById("accountNumber").value);
    localStorage.setItem("swift",            document.getElementById("swift").value);
    localStorage.setItem("iban",             document.getElementById("iban").value);
    localStorage.setItem("vatRate",          document.getElementById("vatRate").value);
    localStorage.setItem("down",             document.getElementById("down").value);

    var dueDateEl = document.getElementById("dueDate2");
    if (dueDateEl) localStorage.setItem("dueDate2", dueDateEl.value);

    var descriptions = document.querySelectorAll('input[name="description[]"]');
    var quotations   = document.querySelectorAll('input[name="quotation[]"]');
    var prices       = document.querySelectorAll('input[name="price[]"]');
    var invoiceItems = [];
    descriptions.forEach(function(desc, index) {
        invoiceItems.push({
            description: desc.value,
            quotation:   quotations[index].value,
            price:       parseFloat(prices[index].value)
        });
    });
    localStorage.setItem("invoiceItems", JSON.stringify(invoiceItems));
}

function printIframe1() {
    saveAllData();
    var iframe1 = document.createElement("iframe");
    iframe1.style.display = "none";
    iframe1.src = "display.html";
    document.body.appendChild(iframe1);
    iframe1.onload = function () {
        iframe1.contentWindow.print();
        setTimeout(function() { document.body.removeChild(iframe1); }, 500);
    };
}

function printIframe2() {
    saveAllData();
    var iframe2 = document.createElement("iframe");
    iframe2.style.display = "none";
    iframe2.src = "display2.html";
    document.body.appendChild(iframe2);
    iframe2.onload = function () {
        iframe2.contentWindow.print();
        setTimeout(function() { document.body.removeChild(iframe2); }, 500);
    };
}

// ---- 2027 server-side PDF flow ----
var SUPABASE_URL_GEN = "https://oodhsoiwnqxcimzmzick.supabase.co";
var SUPABASE_ANON_GEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vZGhzb2l3bnF4Y2ltem16aWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTExMjYsImV4cCI6MjA5NDA4NzEyNn0.K1kAeQyhdu_DTjMq--0M7sQU8Cr8CtqkUqAmchPOr1I";

function getDesignParam() {
    return new URLSearchParams(window.location.search).get("design") || "2027";
}

function getAccessToken() {
    try {
        var raw = localStorage.getItem("sb-oodhsoiwnqxcimzmzick-auth-token");
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        return (parsed && parsed.access_token) || (parsed && parsed.currentSession && parsed.currentSession.access_token) || null;
    } catch (e) { return null; }
}

// Build the InvoicePdfInput payload shared by both Generator buttons.
// variant "A" = downpayment invoice (sub-line under TOTAL DUE), "B" = full balance.
function buildInvoicePayload(variant) {
    var num = function (v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; };
    var params = new URLSearchParams(window.location.search);

    var descriptions = document.querySelectorAll('input[name="description[]"]');
    var quotations   = document.querySelectorAll('input[name="quotation[]"]');
    var prices       = document.querySelectorAll('input[name="price[]"]');
    var lineItems = [];
    var subtotal = 0;
    descriptions.forEach(function (desc, i) {
        var category = (desc.value || "").trim();
        var item = (quotations[i] ? quotations[i].value : "").trim();
        var price = num(prices[i] ? prices[i].value : 0);
        var description = category && item ? (category + " — " + item) : (category || item || "—");
        lineItems.push({ description: description, quantity: 1, unit_price: price });
        subtotal += price;
    });

    var vatRate = num(document.getElementById("vatRate").value);
    var vatAmount = subtotal * vatRate / 100;
    var gross = subtotal + vatAmount;

    var issuedAt = variant === "A"
        ? document.getElementById("invoiceDate").value || null
        : document.getElementById("invoiceInputDate").value || null;
    var dueDate = variant === "A"
        ? null
        : (localStorage.getItem("dueDate2") || (document.getElementById("dueDate2") ? document.getElementById("dueDate2").value : null) || null);

    var totalDueNote = null;
    if (variant === "A") {
        var downPct = num(document.getElementById("down").value);
        if (downPct > 0) {
            var downAmount = gross * downPct / 100;
            var fmt = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(downAmount);
            totalDueNote = downPct + "% downpayment: GBP " + fmt;
        }
    }

    var invoiceNumber = document.getElementById("invoiceNumber").value || null;

    return {
        invoice_number: invoiceNumber,
        reference_number: invoiceNumber,
        amount: gross,
        currency: "GBP",
        status: "sent",
        due_date: dueDate,
        issued_at: issuedAt,
        created_at: new Date().toISOString(),
        notes: null,
        line_items: lineItems,
        client_company: document.getElementById("client").value || null,
        client_name: document.getElementById("contact").value || null,
        client_address: document.getElementById("address").value || null,
        client_registration: params.get("registration") || null,
        client_country: null,
        client_email: null,
        client_position: null,
        subtotal: subtotal,
        vat_rate: vatRate,
        vat_amount: vatAmount,
        total_due_note: totalDueNote,
        bank_details: {
            id: "generator",
            label: "Generator",
            bankName: document.getElementById("bank").value || "",
            sortCode: document.getElementById("sortCode").value || "",
            accountNumber: document.getElementById("accountNumber").value || "",
            swiftCode: document.getElementById("swift").value || "",
            iban: document.getElementById("iban").value || ""
        }
    };
}

async function downloadServerPdf(variant, btn) {
    saveAllData();
    var token = getAccessToken();
    if (!token) {
        alert("Not signed in. Open the Generator from the portal admin so it can authenticate.");
        return;
    }
    var payload = buildInvoicePayload(variant);
    var originalLabel = btn ? btn.textContent : null;
    if (btn) { btn.disabled = true; btn.textContent = "Generating…"; }
    try {
        var res = await fetch(SUPABASE_URL_GEN + "/functions/v1/generate-invoice-pdf-v2", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token,
                "apikey": SUPABASE_ANON_GEN
            },
            body: JSON.stringify(payload)
        });
        if (!res.ok) {
            var msg = "Failed to generate PDF (" + res.status + ")";
            try { var j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
            alert(msg);
            return;
        }
        var blob = await res.blob();
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "invoice-" + ((payload.invoice_number || "invoice").replace(/[^a-zA-Z0-9._-]+/g, "-")) + ".pdf";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
        alert("Failed to generate PDF: " + (e && e.message ? e.message : e));
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    }
}

document.getElementById("printIframe1").addEventListener("click", function (e) {
    if (getDesignParam() === "classic") { printIframe1(); }
    else { downloadServerPdf("A", e.currentTarget); }
});
document.getElementById("printIframe2").addEventListener("click", function (e) {
    if (getDesignParam() === "classic") { printIframe2(); }
    else { downloadServerPdf("B", e.currentTarget); }
});

// Restore saved VAT and downpayment values into inputs on load
document.addEventListener('DOMContentLoaded', function() {
    var savedVAT = localStorage.getItem("vatRate");
    if (savedVAT) document.getElementById("vatRate").value = savedVAT;

    var savedDown = localStorage.getItem("down");
    if (savedDown) document.getElementById("down").value = savedDown;
});

</script>

# Build + lint on every push and pull request.
#
# This exists because of a real incident, not as ceremony: when `npm run build`
# fails, Vercel keeps serving the last successful build. The live URL shows no
# error and the new code is simply never served. CLAUDE.md carries a hard rule
# telling a human to run the build before pushing — this enforces it instead.
#
# `tsc --noEmit` is deliberately NOT the check. esbuild syntax errors pass
# TypeScript and still break the Vite build, so `npm run build` is the only
# authoritative signal.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly. If this step
      # fails, the lockfile is stale — commit an updated one rather than
      # loosening the install.
      - name: Install dependencies
        run: npm ci

      # Authoritative check. Must stay before lint: a broken build is the
      # failure that actually reaches production.
      - name: Build
        run: npm run build

      # Non-blocking, and honestly so: the repo currently reports 429 lint
      # problems (368 errors, 61 warnings), mostly no-explicit-any. Failing the
      # build on that would make CI red from day one and teach everyone to
      # ignore it. It runs so the number is visible and can be driven down.
      # Remove continue-on-error once it reaches zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

  functions:
    name: Typecheck edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Supabase deploys bundle with esbuild and never typecheck, so a type
      # error in a function only surfaces at runtime. This sweep makes it
      # visible in CI instead. Non-blocking for now: 7 functions carry 37
      # pre-existing errors (worst: dropbox-webhook 15, airtable-auto-sync 9,
      # dropbox-save-round-files 4) — drive to zero, then remove
      # continue-on-error. --node-modules-dir=none keeps Deno from trying to
      # resolve npm: specifiers against the frontend's node_modules.
      - name: deno check all functions
        run: |
          fails=0
          for d in supabase/functions/*/; do
            [ -f "$d/index.ts" ] || continue
            if ! NO_COLOR=1 deno check --node-modules-dir=none --quiet "$d/index.ts"; then
              fails=$((fails+1))
            fi
          done
          echo "---- functions with type errors: $fails"
          [ "$fails" -eq 0 ]
        continue-on-error: true
